name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Clean Rebuild & Fix Android Settings
        run: |
          # 1. Clear previous attempts
          rm -rf pubspec.yaml android ios

          # 2. Create clean project structure
          flutter create --org com.rafeeq . --overwrite

          # 3. Create full pubspec.yaml
          cat << 'EOF' > pubspec.yaml
          name: rafeeq_smart
          description: "Smart Companion App"
          publish_to: 'none'

          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.6
            google_mlkit_commons: ^0.8.0
            google_mlkit_text_recognition: ^0.13.0
            google_mlkit_object_detection: ^0.13.0

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
          EOF

          # 4. Update minSdkVersion to 21 for ML Kit compatibility
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle

          # 5. Build APK
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: '**/build/app/outputs/flutter-apk/app-release.apk'

