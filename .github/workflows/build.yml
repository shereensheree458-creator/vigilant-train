name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Rebuild Project and Build APK
        run: |
          mkdir -p temp_app
          cd temp_app
          flutter create --org com.rafeeq my_app
          cd my_app
          
          if [ -d "../../lib" ]; then
            cp -r ../../lib/* ./lib/
          fi
          
          cat << 'EOF' > pubspec.yaml
          name: my_app
          description: "A new Flutter project."
          publish_to: 'none'

          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.6
            google_mlkit_commons: ^0.8.0
            google_mlkit_text_recognition: ^0.13.0
            google_mlkit_object_detection: ^0.13.0

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
          EOF

          flutter pub get
          flutter build apk --release
          
          mkdir -p ../../build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/app-release.apk ../../build/app/outputs/flutter-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: 'build/app/outputs/flutter-apk/app-release.apk'

